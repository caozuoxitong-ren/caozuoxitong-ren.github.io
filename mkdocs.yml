# ============================================================
# 额外配置
# ============================================================
extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:<你的邮箱>
      name: 联系邮箱

# ============================================================
# Markdown 扩展
# ============================================================
markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
      tex_inline_wrap: ['\(', '\)', '$', '$']
      tex_block_wrap: ['\[', '\]', '$$', '$$']
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {}

# ============================================================
# 额外加载的 JavaScript（按顺序）
# ============================================================
extra_javascript:
  # MathJax：先配置，后主库
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

  # Mermaid：先主库，后初始化
  - javascripts/mermaid.min.js
  - javascripts/mermaid.js

  # 外链新标签打开
  - javascripts/external-links.js

  # 访问计数器
  - https://vercount.one/js