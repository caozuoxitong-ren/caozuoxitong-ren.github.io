    <script>
        /* ========== 字号调节 + 默认恢复 ========== */
        const DEFAULT_OUTPUT_FONT_SIZE = 14;
        const DEFAULT_INPUT_FONT_SIZE = 16;

        let currentFontSize = DEFAULT_OUTPUT_FONT_SIZE;
        function adjustFontSize(step) {
            currentFontSize += step * 1;
            currentFontSize = Math.max(1, Math.min(32, currentFontSize));
            document.getElementById('outputArea').style.fontSize = currentFontSize + 'px';
        }
        function resetOutputFontSize() {
            currentFontSize = DEFAULT_OUTPUT_FONT_SIZE;
            document.getElementById('outputArea').style.fontSize = currentFontSize + 'px';
        }

        let currentInputFontSize = DEFAULT_INPUT_FONT_SIZE;
        function adjustInputFontSize(step) {
            currentInputFontSize += step * 1;
            currentInputFontSize = Math.max(1, Math.min(32, currentInputFontSize));
            document.getElementById('inputArea').style.fontSize = currentInputFontSize + 'px';
            if (typeof window.refreshLineNumbers === 'function') {
                window.refreshLineNumbers();
            }
        }
        function resetInputFontSize() {
            currentInputFontSize = DEFAULT_INPUT_FONT_SIZE;
            document.getElementById('inputArea').style.fontSize = currentInputFontSize + 'px';
            if (typeof window.refreshLineNumbers === 'function') {
                window.refreshLineNumbers();
            }
        }

        function clearInput() {
            const inputArea = document.getElementById('inputArea');
            inputArea.value = '';
            inputArea.dispatchEvent(new Event('input', { bubbles: true }));
            inputArea.focus();
        }

        /* ========== 复制功能 + 轻提示 ========== */
        let toastTimer = null;

        function showToast(msg) {
            let toast = document.getElementById('copy-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'copy-toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        function copyOutput() {
            const outputArea = document.getElementById('outputArea');
            let text = outputArea.value;
            if (!text || text.trim() === '') {
                text = outputArea.getAttribute('placeholder') || '';
            }
            if (!text || text.trim() === '') {
                showToast('输出框为空，暂无可复制内容');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制到剪贴板');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('已复制到剪贴板');
                } else {
                    showToast('复制失败，请手动选择复制');
                }
            } catch (err) {
                showToast('复制失败，请手动选择复制');
            }
            document.body.removeChild(textarea);
        }
    </script>

    <script>
        /* ===================== 默认示例内容 ===================== */
        const DEFAULT_INPUT = [
            '生物实体',
            '-非细胞实体',
            '--病毒',
            '---DNA病毒',
            '---RNA病毒',
            '--亚病毒因子',
            '---类病毒',
            '---卫星病毒',
            '---朊病毒',
            '-细胞生命',
            '--细菌域',
            '---变形菌门',
            '---厚壁菌门',
            '---放线菌门',
            '---蓝藻门',
            '--古菌域',
            '---广古菌门',
            '---泉古菌门',
            '---奇古菌门',
            '--真核生物域',
            '---古虫界',
            '---变形虫类',
            '---后鞭毛生物',
            '----领鞭毛虫类',
            '----真菌界',
            '----动物界',
            '---SAR超类群',
            '----根足虫类',
            '----囊泡虫类',
            '----不等鞭毛类',
            '---原始质体生物',
            '----灰胞藻',
            '----红藻',
            '----绿色植物'
        ].join('\n');

        function halfToFull(str) {
            let result = '';
            const lines = str.split('\n');
            for (let line of lines) {
                let dashCount = 0;
                while (line[dashCount] === '-') dashCount++;
                const dashPart = line.substring(0, dashCount);
                let contentPart = line.substring(dashCount);
                let convertedContent = '';
                for (let i = 0; i < contentPart.length; i++) {
                    const charCode = contentPart.charCodeAt(i);
                    if (charCode === 32) {
                        convertedContent += '\u3000';
                    } else if (charCode >= 33 && charCode <= 126) {
                        convertedContent += String.fromCharCode(charCode + 65248);
                    } else {
                        convertedContent += contentPart.charAt(i);
                    }
                }
                result += dashPart + convertedContent + '\n';
            }
            return result.slice(0, -1);
        }

        var s = ["诶，干啥呢！\n", "阿弥陀佛，施主稍安勿躁!\n", "连续点击也是一种乐趣~\n", "点得有点多了哟!\n", "请在左侧输入目录！！！\n"];
        var tree = [];
        var cnt = 0;

        document.addEventListener('DOMContentLoaded', function() {
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            inputArea.addEventListener('input', function() {
                clearTimeout(this.timer);
                this.timer = setTimeout(() => {
                    if (inputArea.value.trim() === '') {
                        outputArea.value = '';
                        return;
                    }
                    transferText(1, false);
                }, 500);
            });
        });

        function transferText(type, allowDefault) {
            if (allowDefault === undefined) allowDefault = true;

            const inputArea = document.getElementById("inputArea");
            const outputArea = document.getElementById("outputArea");

            let inputText = inputArea.value;

            if (allowDefault && inputText.trim().length === 0) {
                inputText = DEFAULT_INPUT;
            }

            if (inputText.trim().length === 0) {
                if (cnt == 0) outputArea.value = "";
                cnt++;
                if (cnt < 5) outputArea.value += "请在左侧输入目录！！！\n";
                else outputArea.value += s[Math.ceil(Math.random() * 5) - 1];
                return;
            }
            cnt = 0;

            const fullWidthText = halfToFull(inputText);

            if (fullWidthText.length == 0) {
                outputArea.value = "请在左侧输入目录！！！\n";
                return;
            }

            outputArea.value = "";

            tree = [];
            var lines = fullWidthText.split("\n");
            var fa_stk = [];
            for (var i = 0; i <= maxlevel; i++) fa_stk[i] = -1;
            var top = -1;
            fa_stk[++top] = 0;
            var maxlevel = 0;
            for (var i = 0, j = 0; j < lines.length; j++) {
                if (lines[j].length == 0) continue;
                var level = 0;
                while (lines[j][level] == '-') level++;
                if (level > maxlevel) maxlevel = level;

                if (i == 0 && lines[j].length > 0 && lines[j][0] == '-') {
                    outputArea.value = "第 " + (j + 1) + " 行有错误：第一行为主题，行前不加短线。\n";
                    return;
                } else if (i > 0 && level == 0) {
                    outputArea.value = "第 " + (j + 1) + " 行有错误：请在行前加短线。\n";
                    return;
                } else if (level > 0 && top + 1 < level) {
                    outputArea.value = "第 " + (j + 1) + " 行有错误：层次不合理。\n";
                    return;
                }

                lines[j] = lines[j].substring(level);
                var fa = -1;
                if (level > 0) {
                    while (top >= level) fa_stk[top--] = -1;
                    fa = fa_stk[level - 1], fa_stk[++top] = i;
                }
                tree[i] = { id: i, value: lines[j], father: fa, children: [], level: level };
                if (fa >= 0) tree[fa].children.push(i);
                i++;
            }

            tree[0].indent = 0;
            for (var i = 1; i < tree.length; i++) {
                tree[i].indent = tree[tree[i].father].indent + tree[tree[i].father].value.length;
            }
            for (var i = tree.length - 1; i >= 0; i--) {
                if (tree[i].children.length == 0) {
                    tree[i].height = 1;
                } else {
                    var sum = 0;
                    for (var j = 0; j < tree[i].children.length; j++) sum += tree[tree[i].children[j]].height;
                    if (sum == 2 && tree[i].children.length == 2) {
                        tree[i].height = 3;
                        tree[tree[i].children[0]].height = 2;
                    } else tree[i].height = sum;
                }
            }
            tree[0].up = 0, tree[0].down = tree[0].height - 1;
            setPos(0, 0, tree[0].height - 1);

            if (type == 1) {
                for (var i = tree.length - 1; i >= 0; i--) {
                    if (tree[i].children.length == 0) continue;
                    tree[i].targetRow = Math.floor((tree[tree[i].children[0]].targetRow + tree[tree[i].children[tree[i].children.length - 1]].targetRow) / 2);
                }
            } else {
                for (var i = 0; i < tree.length; i++) {
                    var cur = i;
                    while (tree[cur].children.length >= 1 && tree[tree[cur].children[0]].targetRow == tree[cur].targetRow) {
                        if (tree[cur].children.length > 1) tree[cur].targetRow++;
                        cur = tree[cur].father;
                        if (cur < 0 || cur >= tree.length) break;
                        if (tree[cur].children.length == 1) tree[cur].targetRow = tree[tree[cur].children[0]].targetRow;
                    }
                }
            }

            var top = [], down = [];
            for (var curlevel = 0; curlevel <= maxlevel; curlevel++) {
                top[curlevel] = 1000000, down[curlevel] = 0;
                for (var j = 0; j < tree.length; j++) {
                    if (tree[j].level == curlevel) {
                        if (tree[j].targetRow < top[curlevel]) top[curlevel] = tree[j].targetRow;
                        if (tree[j].targetRow > down[curlevel]) down[curlevel] = tree[j].targetRow;
                    }
                }
            }

            var res = [];
            for (var i = 0; i < tree[0].height; i++) res[i] = "";
            for (var curlevel = 0; curlevel <= maxlevel; curlevel++) {
                for (var i = 0; i < tree.length; i++) {
                    if (tree[i].level != curlevel) continue;
                    if (curlevel == 0) {
                        for (var j = tree[i].up; j < tree[i].targetRow; j++) for (var k = 0; k < tree[i].value.length; k++) res[j] += "　";
                        res[tree[i].targetRow] += tree[i].value;
                        for (var j = tree[i].targetRow + 1; j <= tree[i].down; j++) for (var k = 0; k < tree[i].value.length; k++) res[j] += "　";
                    } else {
                        var fa = tree[i].father;
                        for (var j = tree[i].up; j < tree[i].targetRow; j++) {
                            if (tree[fa].targetRow == j) res[j] += "┤";
                            else if (i != tree[fa].children[0]) res[j] += "│";
                            else res[j] += "　";
                            for (var k = 0; k < tree[i].value.length; k++) res[j] += "　";
                        }
                        if (tree[fa].children.length == 1) res[tree[i].targetRow] += "－";
                        else if (tree[fa].children.length > 1 && tree[fa].children[0] == i) res[tree[i].targetRow] += "┌";
                        else if (tree[fa].children.length > 1 && tree[fa].children[tree[fa].children.length - 1] == i) res[tree[i].targetRow] += "└";
                        else if (tree[i].targetRow == tree[fa].targetRow) res[tree[i].targetRow] += "┼";
                        else res[tree[i].targetRow] += "├";
                        res[tree[i].targetRow] += tree[i].value;
                        for (var j = tree[i].targetRow + 1; j <= tree[i].down; j++) {
                            if (tree[fa].targetRow == j) res[j] += "┤";
                            else if (i != tree[fa].children[tree[fa].children.length - 1]) res[j] += "│";
                            else res[j] += "　";
                            for (var k = 0; k < tree[i].value.length; k++) res[j] += "　";
                        }
                    }
                }
            }

            for (var i = 0; i < res.length; i++) outputArea.value += res[i] + "\n";

            outputArea.animate([
                { transform: 'translateY(-5px)', opacity: 0.9 },
                { transform: 'translateY(0)', opacity: 1 }
            ], {
                duration: 300,
                easing: 'ease-out'
            });
        }

        function setPos(id, up, down) {
            if (id < 0 || id >= tree.length) return;
            tree[id].targetRow = Math.floor((up + down) / 2);
            tree[id].up = up, tree[id].down = down;
            var pre = 0;
            for (var i = 0; i < tree[id].children.length; i++) {
                var ch = tree[id].children[i];
                setPos(ch, up + pre, up + pre + tree[ch].height - 1);
                pre += tree[ch].height;
            }
        }
    </script>

    <script>
        /* ========== 行号逻辑（transform 同步滚动，消除取整误差） ========== */
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.querySelector('.textarea');
            const numbersCol = document.getElementById('numbersCol');
            const numbersContent = document.getElementById('numbersContent');
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            const parsePx = (v) => {
                const n = parseFloat(v);
                return isNaN(n) ? 0 : n;
            };

            function syncLineNumberStyle() {
                const s = window.getComputedStyle(textarea);
                ['fontFamily', 'fontSize', 'fontWeight', 'letterSpacing'].forEach((p) => {
                    numbersContent.style[p] = s[p];
                });
                numbersContent.style.lineHeight = s.lineHeight;

                const borderTop = parsePx(s.borderTopWidth);
                const borderBottom = parsePx(s.borderBottomWidth);
                const paddingTop = parsePx(s.paddingTop);
                const paddingBottom = parsePx(s.paddingBottom);
                numbersCol.style.paddingTop = (borderTop + paddingTop) + 'px';
                numbersCol.style.paddingBottom = (borderBottom + paddingBottom) + 'px';
            }

            function syncScroll() {
                numbersContent.style.transform = `translateY(${-textarea.scrollTop}px)`;
            }

            function calcStringLines(sentence, width, fontSize, fontFamily) {
                if (!width) return 0;
                context.font = `${fontSize} ${fontFamily}`;
                const words = sentence.split('');
                let lineCount = 0;
                let currentLine = '';
                for (let i = 0; i < words.length; i++) {
                    const wordWidth = context.measureText(words[i]).width;
                    const lineWidth = context.measureText(currentLine).width;
                    if (lineWidth + wordWidth > width) {
                        lineCount++;
                        currentLine = words[i];
                    } else {
                        currentLine += words[i];
                    }
                }
                if (currentLine.trim() !== '') lineCount++;
                return lineCount;
            }

            function calcLines() {
                const s = window.getComputedStyle(textarea);
                const lines = textarea.value.split('\n');
                const textareaWidth = textarea.getBoundingClientRect().width;
                const textareaScrollWidth = textareaWidth - textarea.clientWidth;
                const textareaPaddingLeft = parsePx(s.paddingLeft);
                const textareaPaddingRight = parsePx(s.paddingRight);
                const textareaContentWidth = textareaWidth - textareaPaddingLeft - textareaPaddingRight - textareaScrollWidth;
                const numLines = lines.map(lineString =>
                    calcStringLines(lineString, textareaContentWidth, s.fontSize, s.fontFamily)
                );
                let lineNumbers = [];
                let i = 1;
                while (numLines.length > 0) {
                    const numLinesOfSentence = numLines.shift();
                    lineNumbers.push(i);
                    if (numLinesOfSentence > 1) {
                        Array(numLinesOfSentence - 1)
                            .fill('')
                            .forEach((_) => lineNumbers.push(''));
                    }
                    i++;
                }
                return lineNumbers;
            }

            function initLineNumbers() {
                syncLineNumberStyle();
                const lines = calcLines();
                const lineDoms = Array.from({
                    length: lines.length,
                }, (_, i) => `<div>${lines[i] || '&nbsp;'}</div>`);
                numbersContent.innerHTML = lineDoms.join('');

                const maxLineNumber = lines.length;
                const digitCount = String(Math.max(maxLineNumber, 1)).length;
                const s = window.getComputedStyle(textarea);
                context.font = `${s.fontSize} ${s.fontFamily}`;
                const digitsWidth = context.measureText('9'.repeat(digitCount)).width;
                const paddingX = 16;
                const borderX = 1;
                const minWidth = Math.ceil(digitsWidth + paddingX + borderX);
                numbersCol.style.minWidth = minWidth + 'px';

                syncScroll();
            }

            window.refreshLineNumbers = initLineNumbers;

            initLineNumbers();

            const ro = new ResizeObserver(() => {
                const rect = textarea.getBoundingClientRect();
                numbersCol.style.height = `${rect.height}px`;
                initLineNumbers();
            });
            ro.observe(textarea);

            textarea.addEventListener('scroll', syncScroll, { passive: true });

            textarea.addEventListener('input', () => {
                initLineNumbers();
            });
        });
    </script>
</body>

</html>
